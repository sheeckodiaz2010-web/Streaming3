function defLogo(n){n=String(n||"").toLowerCase();var r=[["netflix","netflix"],["disney","disney"],["hbo|max","max"],["prime|amazon","prime"],["paramount","paramount"],["vix","vix"],["crunchy","crunchy"],["spotify","spotify"]];for(var i=0;i<r.length;i++)if(new RegExp(r[i][0]).test(n))return DEF[r[i][1]];return ""}
function logoOf(p){return p.logo||defLogo(p.n)}
var DEF_RULES="Cada cuenta o perfil es de uso personal.\nUsa solo el perfil y PIN que se te asignó.\nNo cambies el correo, la contraseña ni el PIN de la cuenta.\nNo compartas ni revendas tu perfil.\nSi tienes un problema, repórtalo por la página o por WhatsApp.\nSi se rompen las reglas, el servicio se cancela sin reembolso.";
function rulesList(){return String(D.rules||DEF_RULES).split("\n").map(function(x){return x.trim()}).filter(Boolean)}
function okLogo(u){u=String(u||"");return /^https:\/\//i.test(u)||/^data:image\/(png|jpeg|webp|svg\+xml);base64,/i.test(u)}
function logoHtml(p,i){
 var h='<h3>'+esc(p.n)+'</h3>';
 var lg=logoOf(p);if(!lg||!okLogo(lg)||LB[i])return '<div class="logo" style="background:'+p.c+'">'+esc(p.n)+'</div>'+h;
 return '<div class="logo has" role="img" aria-label="'+esc(p.n)+'"><img src="'+esc(lg)+'" alt="'+esc(p.n)+'" onerror="logoErr('+i+')"></div>'+h}
var LB={};
function logoErr(i){if(LB[i])return;LB[i]=1;console.warn("Logo no cargó:",P[i]&&P[i].n);draw()}
// Contador de perfiles libres desde el panel (solo muestra el número)
var URL_PANEL="https://script.google.com/macros/s/AKfycbwi9ZUUfqvSQhj4Oz_1fzGRlTCKwPBr_qfyF-UrCqZMCtATYtRwyYD6sh_U5KnVEPaR/exec",LIB=null;
function libOf(p){if(!LIB)return null;var n=String(p.n).toLowerCase(),r=null;Object.keys(LIB).forEach(function(k){var kk=String(k).toLowerCase().trim();if(kk&&(n.indexOf(kk)>=0||kk.indexOf(n)>=0))r=Number(LIB[k])||0});return r}
function libSync(){fetch(URL_PANEL+"?accion=libres&t="+Date.now()).then(function(r){return r.json()}).then(function(j){if(j&&j.ok&&j.libres){LIB=j.libres;draw()}}).catch(function(){})}
function draw(){
 var t=document.getElementById("q").value.toLowerCase(),h="";
 P.forEach(function(p,i){
  if(p.n.toLowerCase().indexOf(t)<0)return;
  var lb=libOf(p),q=qty[i]||1,out=p.stock<=0,pl=plansOf(p),m=sel[i]||1;if(pl.indexOf(m)<0)m=1;
  var price=pr(p,m),off=p.old>p.price&&p.price>0,pct=off?Math.round((1-p.price/p.old)*100):0,sv=m>1?(m*p.price-price):0;
  h+='<div class="c'+(off?' ofer':'')+'">'+(off?'<div class="ofr">🔥 OFERTA -'+pct+'%</div>':'')+
  logoHtml(p,i)+
  (pl.length>1?'<div class="chips">'+pl.map(function(x){return '<button class="chip'+(x==m?' on':'')+'" onclick="setM('+i+','+x+')">'+mlabel(p,x)+'</button>'}).join("")+'</div>':'<span class="dur">'+mlabel(p,1)+'</span>')+
  '<div class="p">'+(off&&m==1?'<span class="old">'+money(p.old)+'</span>':'')+money(price)+'</div>'+(sv>0?'<div class="sv">Ahorras '+money(sv)+'</div>':'')+
  '<div class="s '+(out?'no':'ok')+'">● '+(out?'Agotado':(lb>0?lb+(lb==1?' disponible':' disponibles'):'Disponible'))+'</div>'+
  (out?'':'<div class="q"><button onclick="ch('+i+',-1)">−</button><b>'+q+'</b><button onclick="ch('+i+',1)">+</button></div>')+
  '<button class="add" '+(out?'disabled':'')+' onclick="add('+i+')">🛒 Agregar</button></div>';
 });
 document.getElementById("grid").innerHTML=h||'<p style="grid-column:1/-1;color:var(--mu)">Sin resultados.</p>';
}
function ch(i,d){var v=(qty[i]||1)+d;qty[i]=Math.max(1,Math.min(5,v));draw()}
function add(i){var m=sel[i]||1;if(plansOf(P[i]).indexOf(m)<0)m=1;var k=i+"_"+m;cart[k]=Math.min(5,(cart[k]||0)+(qty[i]||1));qty[i]=1;draw();bar()}
function total(){var t=0,n=0;cl().forEach(function(x){t+=x.q*x.pr;n+=x.q});return [t,n]}
function bar(){var r=total(),b=document.getElementById("bar");b.style.display=r[1]?"flex":"none";
 document.getElementById("bn").textContent="🛒 Ver carrito ("+r[1]+")";document.getElementById("bt").textContent=money(r[0])}
function openCart(){
 var h='<h2 style="margin:0 0 6px">Tu pedido</h2>';
 cl().forEach(function(x){h+='<div class="r"><span><b>'+x.p.n+'</b> · '+mlabel(x.p,x.m)+'<br>'+money(x.q*x.pr)+'</span><div class="q2"><button onclick="cq('+x.i+','+x.m+',-1)">−</button><b>'+x.q+'</b><button onclick="cq('+x.i+','+x.m+',1)">+</button><button class="dl" onclick="rm('+x.i+','+x.m+')">🗑</button></div></div>'});
 h+='<div class="r"><b>Total</b><b>'+money(total()[0])+'</b></div><input id="nm" placeholder="Tu nombre" value="'+esc(window.CN||"")+'"><details class="rl" open><summary>📜 Reglas del servicio</summary><ol>'+rulesList().map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol></details><label class="ac"><input type="checkbox" id="ac" '+(window.ACC?"checked":"")+' onchange="window.ACC=this.checked"> ¿Aceptas las reglas?</label><div id="cm" style="color:var(--no);font-size:13px"></div><button class="go" style="background:var(--ac)" onclick="goPay()">Continuar al pago</button><button class="x" onclick="closeCart()">Seguir viendo</button>';
 document.getElementById("box").innerHTML=h;document.getElementById("sheet").style.display="flex"}
function closeCart(){document.getElementById("sheet").style.display="none"}
function saveNm(){var e=document.getElementById("nm");if(e)window.CN=e.value}
function cq(i,m,d){saveNm();var k=i+"_"+m,v=(cart[k]||0)+d;if(v<=0)delete cart[k];else cart[k]=Math.min(5,v);bar();if(total()[1])openCart();else closeCart()}

function parseCSV(t){var R=[],r=[],c="",q=false;for(var i=0;i<t.length;i++){var ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}
 else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);R.push(r);r=[];c=""}else c+=ch}
 if(c!==""||r.length){r.push(c);R.push(r)}return R}
async function sync(){
 if(!SHEET_URL)return;
 document.getElementById("grid").innerHTML='<p style="grid-column:1/-1;color:var(--mu)">Cargando disponibilidad...</p>';
 try{

  var R=parseCSV(await res.text()),pl=[];
  for(var i=1;i<R.length;i++){var c=R[i];if(!c[0]||!c[0].trim())continue;
   pl.push({n:c[0].trim(),price:parseFloat(String(c[2]).replace(/[^0-9.]/g,""))||0,dur:(c[3]||"1 Mes").trim(),c:(c[4]||"#6d4ee8").trim(),stock:/^s/i.test((c[6]||"").trim())?99:0})}

  if(R[1]&&R[1][9]&&R[1][9].trim()){D.title=R[1][9].trim();document.getElementById("ttl").textContent=D.title}
  document.getElementById("rp").innerHTML='<option value="">Elige...</option>'+P.map(function(p){return '<option>'+esc(p.n)+'</option>'}).join("");
 }catch(e){}
 draw()}
sync();
libSync();setInterval(libSync,60000);
