<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f3ff;--card:#fff;--tx:#1b1535;--mu:#6b6590;--ac:#6d4ee8;--ac2:#8b5cf6;--ok:#16a34a;--wn:#d97706;--no:#dc2626;--bd:#e2ddf7}
@media (prefers-color-scheme:dark){:root{--bg:#0f0d1c;--card:#1a1730;--tx:#f0edff;--mu:#9a94c4;--bd:#2c2850;--ac:#7c5cf0;--wn:#f59e0b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;padding-bottom:40px}
header{padding:16px 16px 4px}h1{margin:0;font-size:21px}header p{margin:4px 0 0;color:var(--mu);font-size:13px}
.exp{margin:8px 16px;padding:8px 12px;border-radius:12px;background:#f59e0b22;border:1px solid #f59e0b66;color:var(--wn);font-size:12px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 16px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer}
.k b{display:block;font-size:22px}.k span{font-size:11px;color:var(--mu)}.k.on{outline:2px solid var(--ac)}
.k.g b{color:var(--ok)}.k.y b{color:var(--wn)}.k.r b{color:var(--no)}.k.b b{color:var(--ac)}
#em{width:calc(100% - 32px);margin:0 16px 6px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
#q{width:calc(100% - 32px);margin:6px 16px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 16px}
.tab{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:5px 12px 5px 5px;font-size:13px}
.tab img{width:26px;height:26px;border-radius:50%;object-fit:cover}.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.tab i{font-style:normal;font-size:11px;opacity:.8}
#list{padding:6px 16px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}@media(min-width:760px){#list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.c{min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.t{display:flex;gap:10px;align-items:center}.t img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.t div{flex:1;min-width:0;overflow:hidden}.t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;font-size:12px;font-weight:bold;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:#16a34a22;color:var(--ok)}.p-wn{background:#f59e0b22;color:var(--wn)}.p-no{background:#dc262622;color:var(--no)}.p-fr{background:#6d4ee822;color:var(--ac)}
.f{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;border-top:1px solid var(--bd);padding-top:6px}
.f span{color:var(--mu);font-size:11px;display:block}.f>div{min-width:0}.f b{font-weight:600;word-break:break-all}
.cp{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:6px 10px;font-size:12px;flex:none}
.cp.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.bt{display:flex;gap:8px}.bt a,.bt button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:10px;font-size:13px;font-weight:bold;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.bt .w{background:#16a34a}.bt .g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.em{color:var(--mu);padding:30px;text-align:center}
</style><style>
#mo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
#mb{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#mb h2{margin:0 0 4px;font-size:18px}#mb p{margin:0 0 8px;color:var(--mu);font-size:12px}
.ctr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.ctr span{color:var(--mu);font-size:13px}
#mb label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
#mb input,#mb select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.chs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.chs button,.mini{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:7px 12px;font-size:12px}
.pri{width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:bold;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.sec{width:100%;margin-top:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;padding:12px;font-size:14px}
.dng{width:100%;margin-top:8px;border:1px solid var(--no);background:transparent;color:var(--no);border-radius:14px;padding:12px;font-size:14px;font-weight:bold}.dng.arm{background:var(--no);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;font-size:30px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 22px rgba(124,92,240,.5);z-index:10}
#tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
.bt2{display:flex;gap:8px}.bt2 button{flex:1}
.bt .g2{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
body{padding-bottom:100px}
</style><style>
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.005em}
body.lk{overflow:hidden}
button,input,select,a{font-family:inherit;touch-action:manipulation}
button,.k,.tab,.bt a{-webkit-user-select:none;user-select:none;transition:transform .16s cubic-bezier(.3,.7,.4,1),opacity .2s,background-color .2s,border-color .2s,box-shadow .2s,color .2s}
.k:active,.tab:active,.cp:active,.bt a:active,.bt button:active,.pri:active,.sec:active,.dng:active,.fab:active,.mini:active,.chs button:active{transform:scale(.95);opacity:.85}
.fab{transition:transform .2s cubic-bezier(.3,.7,.4,1),box-shadow .2s}.fab:active{transform:scale(.9)}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
#q,#em,#mb input,#mb select{font-size:16px!important;transition:border-color .2s,box-shadow .2s}
#q:focus,#em:focus,#mb input:focus,#mb select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(109,78,232,.2)}
.k{box-shadow:0 1px 2px rgba(27,21,53,.05);transition:transform .16s,box-shadow .2s,outline-color .2s}.k.on{outline:0;box-shadow:0 0 0 2px var(--ac),0 6px 16px -6px rgba(109,78,232,.5)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 16px;scrollbar-width:none;background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
.tabs::-webkit-scrollbar{display:none}
.tab.on{box-shadow:0 6px 14px -6px rgba(109,78,232,.7)}
.c{border-radius:20px;box-shadow:0 1px 2px rgba(27,21,53,.04),0 10px 26px -14px rgba(27,21,53,.18);content-visibility:auto;contain-intrinsic-size:auto 240px}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
#list.an .c{animation:up .42s cubic-bezier(.22,1,.36,1) both}
#list.an .c:nth-child(2){animation-delay:.04s}#list.an .c:nth-child(3){animation-delay:.08s}#list.an .c:nth-child(4){animation-delay:.12s}#list.an .c:nth-child(5){animation-delay:.16s}#list.an .c:nth-child(n+6){animation-delay:.2s}
#mo{background:rgba(10,8,25,0);transition:background .3s,backdrop-filter .3s,-webkit-backdrop-filter .3s}
#mo.sh{background:rgba(10,8,25,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
#mb{transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);will-change:transform;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
#mo.sh #mb{transform:none}
#mb::before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:var(--bd);margin:-6px auto 14px}
#tt{background:rgba(17,17,17,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transform:translate(-50%,16px) scale(.96);transition:opacity .25s,transform .35s cubic-bezier(.34,1.56,.64,1)}
#tt.on{opacity:1;transform:translate(-50%,0) scale(1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.pls{display:block}.pw{border-top:1px solid var(--bd)}.pr{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}.pr:active{opacity:.7}
.pn{width:34px;height:34px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex:none}
.pi{flex:1;min-width:0}.pi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr.fr .pi b{color:var(--mu)}.pa{display:none;gap:8px;padding:0 0 10px}.pw.op .pa{display:grid}.nt{font-size:12px;color:var(--wn);text-align:center}

var CFG={u:"",k:""},TS=0,CS="",_pt;
function cfgLoad(){try{var c=JSON.parse(localStorage.getItem("panel_cfg")||"{}");CFG.u=c.u||"";CFG.k=c.k||"";TS=+localStorage.getItem("panel_ts")||0}catch(e){}}
function cloudPush(){if(!CFG.u)return;clearTimeout(_pt);_pt=setTimeout(function(){fetch(CFG.u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({clave:CFG.k,ts:TS,data:DATA,contactos:CT})}).then(function(r){return r.json()}).then(function(j){if(j.ok){CS="ok"}else{CS="err";toast("⚠️ Nube: "+(j.error||"error"))}}).catch(function(){CS="err";toast("⚠️ Sin conexión: se guardó solo en este celular")})},800)}
function cloudSync(show){if(!CFG.u)return;fetch(CFG.u+"?accion=datos&clave="+encodeURIComponent(CFG.k)).then(function(r){return r.json()}).then(function(j){if(!j.ok){CS="err";toast("⚠️ Nube: "+(j.error||"error"));return}
 if(!j.data){if(!TS)TS=Date.now();try{localStorage.setItem("panel_ts",TS)}catch(e){}cloudPush();CS="ok";if(show)toast("☁️ Conectado: datos subidos")}
 else if(j.ts>TS){DATA=j.data;CT=j.contactos||CT;TS=j.ts;try{localStorage.setItem(KEY0,JSON.stringify(DATA));localStorage.setItem(KEYC,JSON.stringify(CT));localStorage.setItem("panel_ts",TS)}catch(e){}CS="ok";draw();toast("☁️ Datos al día")}
 else if(TS>j.ts){cloudPush();CS="ok";if(show)toast("☁️ Conectado")}
 else{CS="ok";if(show)toast("☁️ Conectado")}}).catch(function(){CS="err";toast("⚠️ Sin conexión con la nube")})}
function openCfg(){mo('<h2>☁️ Conectar nube</h2><p>Pega la URL de tu Apps Script y la clave que pusiste en el código.</p><label>URL</label><input id="g_u" value="'+esc(CFG.u)+'" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off"><label>Clave</label><input id="g_k" value="'+esc(CFG.k)+'" autocapitalize="off"><button class="pri" onclick="cfgSave()">Guardar y sincronizar</button>'+(CFG.u?'<button class="sec" onclick="cfgOff()">Desconectar</button>':'')+'<button class="sec" onclick="cm()">Cerrar</button>')}
function cfgSave(){CFG.u=V("g_u");CFG.k=V("g_k");try{localStorage.setItem("panel_cfg",JSON.stringify(CFG))}catch(e){}cm();toast("☁️ Sincronizando...");cloudSync(true)}
function cfgOff(){CFG={u:"",k:""};try{localStorage.removeItem("panel_cfg")}catch(e){}cm();toast("Nube desconectada")}

function openAcc(){var pls=Object.keys(KEY);
 mo('<h2>Agregar cuenta</h2><p>Se crean los perfiles libres de una vez.</p><label>Plataforma</label><select id="a_pl" onchange="accPin()">'+pls.map(function(p){return '<option>'+esc(p)+'</option>'}).join("")+'</select>'+
 '<label>Correo</label><input id="a_em" placeholder="correo@gmail.com" autocapitalize="off"><label>Contraseña</label><input id="a_pw" autocapitalize="off">'+
 '<div class="row2"><div><label>¿Cuántos perfiles?</label><input id="a_n" type="number" inputmode="numeric" value="5" min="1" max="10"></div><div><label>¿Con PIN?</label><select id="a_pn"><option value="1">Sí</option><option value="0">No</option></select></div></div>'+
 '<button class="pri" onclick="addAcc()">Crear cuenta</button><button class="sec" onclick="cm()">Cancelar</button>');accPin()}
function accPin(){document.getElementById("a_pn").value=NOPIN.indexOf(V("a_pl"))<0?"1":"0"}
function addAcc(){var pl=V("a_pl"),em=V("a_em"),pw=V("a_pw"),n=Math.max(1,Math.min(10,parseInt(V("a_n"))||1)),pn=V("a_pn")=="1";
 if(!em||!pw){toast("Falta correo o contraseña");return}
 if(DATA.some(function(o){return o.em==em&&o.pl==pl})){toast("Esa cuenta ya existe");return}
 for(var i=1;i<=n;i++)DATA.push({pl:pl,st:"",nm:"",ph:"",pf:"P"+i,pin:pn?rpin(pl,em):"",em:em,pw:pw,fn:"",d:null,s:""});
 save();F=pl;S="";cm();draw();toast("✅ Cuenta creada con "+n+" perfiles")}
function accounts(){var m={},L=[];DATA.forEach(function(o){var k=o.pl+"|"+o.em;if(!m[k]){m[k]=1;L.push({pl:o.pl,em:o.em})}});return L}
function openAddP(){var L=accounts();mo('<h2>Agregar perfil</h2><p>Se agrega un perfil libre a la cuenta que elijas.</p><label>Cuenta</label><select id="p_ac">'+L.map(function(a,i){return '<option value="'+i+'">'+esc(a.pl)+' · '+esc(a.em)+'</option>'}).join("")+'</select><button class="pri" onclick="addProf()">Agregar perfil</button><button class="sec" onclick="cm()">Cancelar</button>')}
function addProf(){var a=accounts()[+V("p_ac")],g=DATA.filter(function(o){return o.em==a.em&&o.pl==a.pl}),mx=0;g.forEach(function(o){var m=/^P(\d+)$/.exec(o.pf);if(m)mx=Math.max(mx,+m[1])});
 DATA.push({pl:a.pl,st:"",nm:"",ph:"",pf:"P"+(mx+1),pin:usesPin(a.pl,a.em)?rpin(a.pl,a.em):"",em:a.em,pw:g[0].pw,fn:"",d:null,s:""});save();F=a.pl;cm();draw();toast("✅ Perfil P"+(mx+1)+" agregado")}
function backup(){var b=new Blob([JSON.stringify({panel:1,data:DATA,contactos:CT})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="panel-respaldo-"+iso(today())+".json";document.body.appendChild(a);a.click();a.remove();toast("⬇️ Respaldo descargado")}
function restore(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result),c=null;if(d&&!Array.isArray(d)&&Array.isArray(d.data)){c=d.contactos;d=d.data}if(!Array.isArray(d)||!d.every(function(o){return o&&o.pl&&o.em!=null}))throw 0;DATA=d;if(Array.isArray(c))CT=c.filter(function(x){return x&&x.nm});d.forEach(function(o){if(o.nm)ctAdd(o.nm,o.ph,1)});CT.sort(ctSort);saveCT();save();cm();draw();toast("⬆️ Respaldo importado ("+d.length+" perfiles, "+CT.length+" contactos)")}catch(e){toast("❌ Ese archivo no es un respaldo válido")}};r.readAsText(f)}
